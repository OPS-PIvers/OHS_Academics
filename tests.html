<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Lexend', sans-serif;
        padding: 40px;
        color: #333;
        background-color: #f3f4f6;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #2d3f89;
        border-bottom: 2px solid #e5e7eb;
        padding-bottom: 10px;
        margin-top: 0;
      }
      .status-item {
        border: 1px solid #e5e7eb;
        padding: 15px;
        margin-bottom: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-radius: 4px;
        background-color: #fff;
      }
      .status-pass {
        color: #2d3f89;
        font-weight: bold;
      }
      .status-fail {
        color: #ad2122;
        font-weight: bold;
      }
      .item-fail {
        border-color: #ad2122;
        background-color: #fce8e8;
      }
      .test-name {
        font-weight: bold;
        color: #333;
      }
      .test-message {
        font-size: 0.9em;
        color: #666;
        margin-left: 10px;
      }
      #loading {
        text-align: center;
        color: #666;
        padding: 20px;
      }
      .back-link {
        display: inline-block;
        margin-top: 20px;
        color: #2d3f89;
        text-decoration: none;
        font-weight: 500;
      }
      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>System Health Diagnostic</h1>
      <div id="results">
        <div id="loading">Running system checks...</div>
      </div>
      <a href="<?= ScriptApp.getService().getUrl() ?>" class="back-link">← Back to Dashboard</a>
    </div>

    <script>
      google.script.run
        .withSuccessHandler(showResults)
        .withFailureHandler(showError)
        .getSystemHealth();

      function showResults(checks) {
        const container = document.getElementById('results');
        container.innerHTML = '';

        let allPassed = true;

        checks.forEach(check => {
          if (!check.passed) allPassed = false;

          const div = document.createElement('div');
          div.className = 'status-item' + (check.passed ? '' : ' item-fail');

          const leftDiv = document.createElement('div');

          const label = document.createElement('span');
          label.className = 'test-name';
          label.textContent = check.test;

          const message = document.createElement('div');
          message.className = 'test-message';
          message.textContent = check.message;

          leftDiv.appendChild(label);
          leftDiv.appendChild(message);

          const status = document.createElement('span');
          status.className = check.passed ? 'status-pass' : 'status-fail';
          status.textContent = check.passed ? 'PASSED' : 'FAILED';

          div.appendChild(leftDiv);
          div.appendChild(status);
          container.appendChild(div);
        });

        if (allPassed) {
             const summary = document.createElement('div');
             summary.style.marginTop = '20px';
             summary.style.padding = '10px';
             summary.style.backgroundColor = '#e0e7ff';
             summary.style.color = '#2d3f89';
             summary.style.fontWeight = 'bold';
             summary.style.textAlign = 'center';
             summary.style.borderRadius = '4px';
             summary.textContent = 'All Systems Operational';
             container.prepend(summary);
        }
      }

      function showError(error) {
        const container = document.getElementById('results');
        container.innerHTML = `
          <div style="font-family: 'Lexend', sans-serif; border: 1px solid #ad2122; background-color: #fce8e8; padding: 20px; border-radius: 4px;">
            <span style="font-weight: bold; color: #ad2122;">Fatal Error:</span>
            <div style="margin-top: 10px;">${error.message}</div>
          </div>
        `;
      }
    </script>
  </body>
</html>
