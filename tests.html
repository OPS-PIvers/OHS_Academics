<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Health Diagnostic</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (pinned version for stability) -->
    <script src="https://cdn.tailwindcss.com/3.3.3"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Lexend', 'sans-serif'],
            },
            colors: {
              ops: {
                primary: '#2d3f89',
                'blue-dark': '#1d2a5d',
                'blue-light': '#4356a9',
                'blue-lighter': '#eaecf5',
                red: '#ad2122',
                'red-dark': '#7a1718',
                'red-lighter': '#e5c7c7',
                gray: '#333333',
                'gray-dark': '#1a1a1a',
                'gray-light': '#f2f2f3',
              }
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Lexend', sans-serif; background-color: #f3f4f6; }
      .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #2d3f89;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="p-8">
    <div class="max-w-4xl mx-auto bg-white rounded-lg shadow-md overflow-hidden">
      <!-- Header -->
      <div class="bg-ops-primary p-6">
        <h1 class="text-2xl font-bold text-white flex items-center">
          <span class="mr-2">🔭</span> System Health Diagnostic
        </h1>
        <p class="text-ops-blue-lighter mt-2 text-sm">Automated reliability checks for OHS Academics Hub</p>
      </div>

      <!-- Content -->
      <div class="p-6">
        <div id="loading" class="text-center py-12">
          <div class="spinner"></div>
          <p class="text-ops-gray mt-4 font-medium">Running diagnostics...</p>
        </div>

        <div id="report" class="hidden space-y-8">

          <!-- Summary Card -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-ops-blue-lighter p-4 rounded border border-ops-primary">
              <h3 class="text-xs font-bold text-ops-primary uppercase tracking-wider">Status</h3>
              <p id="globalStatus" class="text-xl font-bold text-ops-blue-dark mt-1">Checking...</p>
            </div>
            <div class="bg-gray-50 p-4 rounded border border-gray-200">
              <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Timestamp</h3>
              <p id="timestamp" class="text-sm font-medium text-gray-700 mt-1">-</p>
            </div>
            <div class="bg-gray-50 p-4 rounded border border-gray-200">
              <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider">Environment</h3>
              <p class="text-sm font-medium text-gray-700 mt-1">Production</p>
            </div>
          </div>

          <!-- Section: Logic Validation -->
          <div>
            <h2 class="text-lg font-bold text-ops-gray-dark mb-4 border-b pb-2">Logic Validation</h2>
            <div id="logicTests" class="space-y-3">
              <!-- Test items injected here -->
            </div>
          </div>

          <!-- Section: Infrastructure -->
          <div>
            <h2 class="text-lg font-bold text-ops-gray-dark mb-4 border-b pb-2">Infrastructure</h2>
            <div id="infraTests" class="space-y-3">
              <!-- Infra items injected here -->
            </div>
          </div>

        </div>

        <!-- Error State -->
        <div id="error" class="hidden bg-ops-red-lighter border border-ops-red p-6 rounded text-center">
          <h3 class="text-ops-red-dark font-bold text-lg">System Error</h3>
          <p id="errorMessage" class="text-ops-red mt-2"></p>
        </div>

      </div>

      <!-- Footer -->
      <div class="bg-gray-50 p-4 border-t border-gray-200 text-center">
        <p class="text-xs text-gray-500">Generated by Scout 🔭 | OPS Tech Reliability</p>
      </div>
    </div>

    <script>
      function renderStatusItem(label, passed, details = "") {
        const colorClass = passed ? 'text-ops-primary' : 'text-ops-red';
        const bgClass = passed ? 'bg-white' : 'bg-ops-red-lighter';
        const borderClass = passed ? 'border-gray-200' : 'border-ops-red';
        const statusText = passed ? 'PASSED' : 'FAILED';

        return `
          <div class="flex items-center justify-between p-4 border ${borderClass} rounded ${bgClass}">
            <div>
              <span class="font-bold text-ops-gray block">${label}</span>
              ${details ? `<span class="text-xs text-gray-500 mt-1 block">${details}</span>` : ''}
            </div>
            <span class="${colorClass} font-bold text-sm tracking-wider px-3 py-1 rounded bg-opacity-10 ${passed ? 'bg-blue-100' : 'bg-red-100'}">
              ${statusText}
            </span>
          </div>
        `;
      }

      function loadReport() {
        google.script.run
          .withSuccessHandler(data => {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('report').classList.remove('hidden');

            // Timestamp
            document.getElementById('timestamp').textContent = new Date(data.timestamp).toLocaleString();

            // Logic Tests (generateNameKey)
            const keyTest = data.tests.generateNameKey;
            const keyTestDetails = `Tested ${keyTest.passed + keyTest.failed} cases. ${keyTest.passed} passed.`;
            document.getElementById('logicTests').innerHTML = renderStatusItem(
              "Name Normalization (generateNameKey)",
              keyTest.failed === 0,
              keyTest.failed > 0 ? keyTest.failures.join('<br>') : keyTestDetails
            );

            // Infrastructure Tests (Sheets)
            const sheetHtml = data.infrastructure.sheets.map(sheet => {
              const details = sheet.exists ? `Found ${sheet.rows} rows.` : "Sheet missing!";
              return renderStatusItem(`Sheet: ${sheet.name}`, sheet.exists, details);
            }).join('');

            // Config Check
            const configHtml = renderStatusItem("Metric Configuration", data.infrastructure.config.snapshotMetrics, "SNAPSHOT_METRICS_CONFIG loaded.");

            document.getElementById('infraTests').innerHTML = configHtml + sheetHtml;

            // Global Status
            const allPassed = keyTest.failed === 0 && data.infrastructure.sheets.every(s => s.exists);
            const statusEl = document.getElementById('globalStatus');
            if (allPassed) {
              statusEl.textContent = "Healthy";
              statusEl.className = "text-xl font-bold text-ops-primary mt-1";
            } else {
              statusEl.textContent = "Attention Needed";
              statusEl.className = "text-xl font-bold text-ops-red mt-1";
            }

          })
          .withFailureHandler(error => {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('errorMessage').textContent = error.message;
          })
          .getSystemHealth();
      }

      window.onload = loadReport;
    </script>
  </body>
</html>
