<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lexend', sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background-color: #f3f4f6;
    }
    h1 {
      color: #1f2937;
      margin-bottom: 20px;
    }
    .status-item {
      background-color: white;
      border: 1px solid #e5e7eb;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .status-item.failed {
      border: 1px solid #ad2122;
      background-color: #e5c7c7;
    }
    .test-name {
      font-weight: 600;
      color: #333;
    }
    .test-message {
      font-size: 0.9em;
      color: #666;
      margin-top: 4px;
    }
    .failed .test-name {
      color: #7a1718;
    }
    .failed .test-message {
      color: #7a1718;
    }
    .badge {
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
    }
    .badge-pass {
      color: #2d3f89; /* OPS Tech Blue */
      background-color: #e0e7ff;
    }
    .badge-fail {
      color: #ad2122; /* OPS Tech Red */
      background-color: #fecaca;
    }
    .loading {
      text-align: center;
      color: #666;
      padding: 20px;
    }
  </style>
  <script>
    function loadTests() {
      google.script.run
        .withSuccessHandler(renderResults)
        .withFailureHandler(renderError)
        .runAllTests();
    }

    function renderResults(results) {
      const container = document.getElementById('results-container');
      container.innerHTML = '';

      if (results.length === 0) {
        container.innerHTML = '<div class="status-item">No tests found.</div>';
        return;
      }

      results.forEach(result => {
        const div = document.createElement('div');
        div.className = result.passed ? 'status-item' : 'status-item failed';

        const badgeClass = result.passed ? 'badge-pass' : 'badge-fail';
        const badgeText = result.passed ? 'PASSED' : 'FAILED';

        div.innerHTML = `
          <div>
            <div class="test-name">${result.name}</div>
            <div class="test-message">${result.message}</div>
          </div>
          <span class="badge ${badgeClass}">${badgeText}</span>
        `;
        container.appendChild(div);
      });
    }

    function renderError(error) {
       const container = document.getElementById('results-container');
       container.innerHTML = `<div class="status-item failed">
          <div>
            <div class="test-name">Execution Error</div>
            <div class="test-message">${error.message}</div>
          </div>
          <span class="badge badge-fail">ERROR</span>
       </div>`;
    }

    window.onload = loadTests;
  </script>
</head>
<body>
  <h1>System Health Diagnostic</h1>
  <div id="results-container">
    <div class="loading">Running tests...</div>
  </div>
</body>
</html>
