<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lexend', sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f3f4f6;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2d3f89;
      margin-top: 0;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 10px;
    }
    .status-card {
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-card.pass {
      border-left: 5px solid #2d3f89;
    }
    .status-card.fail {
      border-left: 5px solid #ad2122;
      background-color: #e5c7c7;
    }
    .status-label {
      font-weight: 500;
      font-size: 16px;
    }
    .status-badge {
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
    }
    .pass .status-badge {
      color: #2d3f89;
      background-color: #e0e7ff;
    }
    .fail .status-badge {
      color: #ad2122;
      background-color: #fee2e2;
    }
    .message {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }
    #loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    .ops-btn-primary {
      background-color: #2d3f89;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Lexend', sans-serif;
      font-weight: 500;
    }
    .ops-btn-primary:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>System Health Diagnostic 🔭</h1>

    <div id="loading">
      Running diagnostics...
    </div>

    <div id="results" style="display: none;">
      <div id="overall-status" style="margin-bottom: 20px; font-size: 18px; font-weight: bold;"></div>
      <div id="checks-list"></div>

      <div style="margin-top: 20px; text-align: right;">
        <button class="ops-btn-primary" onclick="runDiagnostics()">Rerun Checks</button>
      </div>
    </div>
  </div>

  <script>
    function runDiagnostics() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('results').style.display = 'none';
      document.getElementById('checks-list').innerHTML = '';

      google.script.run
        .withSuccessHandler(showResults)
        .withFailureHandler(showError)
        .getSystemHealth();
    }

    function showResults(data) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('results').style.display = 'block';

      // Overall Status
      const overallEl = document.getElementById('overall-status');
      if (data.overall === 'PASS') {
        overallEl.innerHTML = '<span style="color: #2d3f89;">System Status: OPERATIONAL ✅</span>';
      } else {
        overallEl.innerHTML = '<span style="color: #ad2122;">System Status: ISSUES DETECTED ⚠️</span>';
      }

      // Render Checks
      const listEl = document.getElementById('checks-list');
      data.checks.forEach(check => {
        const div = document.createElement('div');
        const isPass = check.status === 'PASS';
        div.className = 'status-card ' + (isPass ? 'pass' : 'fail');

        div.innerHTML = `
          <div>
            <div class="status-label" style="color: ${isPass ? '#333' : '#7a1718'}">${check.name}</div>
            <div class="message">${check.message || ''}</div>
          </div>
          <div class="status-badge">${check.status}</div>
        `;
        listEl.appendChild(div);
      });
    }

    function showError(error) {
      document.getElementById('loading').style.display = 'none';
      const results = document.getElementById('results');
      results.style.display = 'block';
      results.innerHTML = `<div style="color: #ad2122; padding: 20px; border: 1px solid #ad2122; background: #fee2e2;">Fatal Error: ${error.message}</div>`;
    }

    // Run on load
    window.onload = runDiagnostics;
  </script>
</body>
</html>
