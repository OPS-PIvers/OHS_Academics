<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Health Diagnostic</title>
  <!-- Load Lexend Font -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lexend', sans-serif;
      background-color: #f3f4f6;
      color: #333;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2d3f89; /* Primary Blue */
      margin-bottom: 20px;
      border-bottom: 2px solid #eaecf5;
      padding-bottom: 10px;
    }
    .section {
      margin-bottom: 25px;
    }
    .section-title {
      font-size: 1.1em;
      font-weight: 600;
      color: #1d2a5d; /* Blue Dark */
      margin-bottom: 10px;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      border: 1px solid #e5e7eb;
      margin-bottom: 8px;
      border-radius: 4px;
      background-color: #fff;
    }
    .status-item.fail {
      border-color: #ad2122; /* Primary Red */
      background-color: #e5c7c7; /* Red Lighter */
    }
    .status-label {
      font-weight: 500;
    }
    .status-badge {
      font-weight: 700;
    }
    .pass {
      color: #2d3f89; /* Primary Blue */
    }
    .fail {
      color: #ad2122; /* Primary Red */
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }
    /* Spinner */
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #2d3f89;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔭 Scout: System Health Diagnostic</h1>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Running system checks...</p>
    </div>

    <div id="report" style="display: none;">

      <div class="section">
        <div class="section-title">Sheet Integrity</div>
        <div id="sheets-results"></div>
      </div>

      <div class="section">
        <div class="section-title">Configuration & Logic</div>
        <div id="config-results"></div>
      </div>

    </div>
  </div>

  <script>
    function renderItem(item) {
      const isPass = item.status === 'PASS';
      const statusClass = isPass ? 'pass' : 'fail';
      const containerClass = isPass ? 'status-item' : 'status-item fail';

      return `
        <div class="${containerClass}">
          <span class="status-label">${item.name}</span>
          <span>
            <span style="margin-right: 10px; font-weight: normal; font-size: 0.9em;">${item.message}</span>
            <span class="status-badge ${statusClass}">${item.status}</span>
          </span>
        </div>
      `;
    }

    function loadHealth() {
      google.script.run
        .withSuccessHandler(function(results) {
          const sheetsDiv = document.getElementById('sheets-results');
          const configDiv = document.getElementById('config-results');

          let sheetsHtml = '';
          results.sheets.forEach(item => {
            sheetsHtml += renderItem(item);
          });
          sheetsDiv.innerHTML = sheetsHtml;

          let configHtml = '';
          [...results.config, ...results.logic].forEach(item => {
            configHtml += renderItem(item);
          });
          configDiv.innerHTML = configHtml;

          document.getElementById('loading').style.display = 'none';
          document.getElementById('report').style.display = 'block';
        })
        .withFailureHandler(function(error) {
           document.getElementById('loading').innerHTML = `
             <div style="color: #ad2122; font-weight: bold;">
               Error running checks: ${error.message}
             </div>
           `;
        })
        .getSystemHealth();
    }

    window.onload = loadHealth;
  </script>
</body>
</html>
