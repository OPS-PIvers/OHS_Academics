<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Lexend', sans-serif;
      background-color: #f3f4f6;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2d3f89; /* OPS Primary Blue */
      border-bottom: 2px solid #eaecf5;
      padding-bottom: 15px;
    }
    .status-item {
      border: 1px solid #e5e7eb;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-item.passed {
      border-left: 5px solid #2d3f89;
    }
    .status-item.failed {
      border-left: 5px solid #ad2122; /* OPS Primary Red */
      background-color: #fff5f5;
    }
    .badge {
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 4px;
    }
    .badge.passed {
      color: #2d3f89;
      background-color: #eaecf5; /* OPS Blue Lighter */
    }
    .badge.failed {
      color: #ad2122;
      background-color: #e5c7c7; /* OPS Red Lighter */
    }
    #loading {
      text-align: center;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔭 Scout System Diagnostic</h1>
    <div id="loading">Running diagnostics...</div>
    <div id="results"></div>
  </div>

  <script>
    function renderResult(test) {
      const div = document.createElement('div');
      div.className = `status-item ${test.passed ? 'passed' : 'failed'}`;

      div.innerHTML = `
        <div>
          <div style="font-weight: bold;">${test.name}</div>
          <div style="font-size: 0.9em; color: #666; margin-top: 4px;">${test.message}</div>
        </div>
        <span class="badge ${test.passed ? 'passed' : 'failed'}">
          ${test.passed ? 'PASSED' : 'FAILED'}
        </span>
      `;
      return div;
    }

    google.script.run
      .withSuccessHandler(function(results) {
        document.getElementById('loading').style.display = 'none';
        const container = document.getElementById('results');
        if (!results || results.length === 0) {
           container.innerHTML = "<div>No results returned.</div>";
           return;
        }
        results.forEach(test => {
          container.appendChild(renderResult(test));
        });
      })
      .withFailureHandler(function(error) {
        document.getElementById('loading').innerText = "Error running tests: " + error.message;
        document.getElementById('loading').style.color = '#ad2122';
      })
      .runAllTests();
  </script>
</body>
</html>
